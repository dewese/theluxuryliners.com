# The checks every change must pass before it reaches main (docs/HANDBOOK.md, chapter 11; branch
# protection requires the "checks" job). Read-only: it builds and tests, never deploys.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # the browser suite drives the Chrome that GitHub's Ubuntu runners already have; nothing
      # is downloaded (the handbook's rule: never `playwright install`)
      - run: npm test
        env:
          CHROMIUM: /usr/bin/google-chrome
      - run: node ../content/check-content.mjs --dist dist
