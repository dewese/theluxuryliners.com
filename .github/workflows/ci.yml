# The checks every change must pass before it reaches main (docs/HANDBOOK.md, chapter 11; branch
# protection requires the "checks" job). Read-only: it builds and tests, never deploys.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      # actions pinned to full commit SHAs (audit-security round 2, minor); the tag is in the comment
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # the browser suite drives the Chrome that GitHub's Ubuntu runners already have; nothing
      # is downloaded (the handbook's rule: never `playwright install`)
      # the private-literal check needs its key (content/private-literals.mjs). Until the repo
      # secret PRIVATE_LITERALS_KEY is added, PRIVATE_LITERALS_OPTIONAL=1 lets the rest of CI run
      # (the check warns that it is off); once the secret exists the check is enforced here.
      # Release builds (RELEASE=1) always refuse to run without the key.
      - run: npm test
        env:
          CHROMIUM: /usr/bin/google-chrome
          PRIVATE_LITERALS_KEY: ${{ secrets.PRIVATE_LITERALS_KEY }}
          PRIVATE_LITERALS_OPTIONAL: ${{ secrets.PRIVATE_LITERALS_KEY == '' && '1' || '' }}
      - run: node ../content/check-content.mjs --dist dist
        env:
          PRIVATE_LITERALS_KEY: ${{ secrets.PRIVATE_LITERALS_KEY }}
          PRIVATE_LITERALS_OPTIONAL: ${{ secrets.PRIVATE_LITERALS_KEY == '' && '1' || '' }}
